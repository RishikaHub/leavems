<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">LeaveMS</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navbarContent" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leave/requests}">My Requests</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leave/requests/new}">Create Request</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/availability}">Availability</a>
                </li>

                <li class="nav-item"
                    th:if="${currentUser != null and currentUser.role.name() == 'MANAGER'}">
                    <a class="nav-link" th:href="@{/manager/requests}">Manager Requests</a>
                </li>
            </ul>

            <form th:action="@{/auth/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
