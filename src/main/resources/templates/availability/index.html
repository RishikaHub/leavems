<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team Availability - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="fragments/layout :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4">Team Availability</h1>
            <p class="text-muted mb-0">View approved future leave and who is available for work.</p>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/leave/requests}">My Requests</a>
    </div>

    <form class="row g-3 mb-4" th:action="@{/availability}" method="get">
        <div class="col-md-4">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="startDate" th:value="${startDate}">
        </div>
        <div class="col-md-4">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" name="endDate" th:value="${endDate}">
        </div>
        <div class="col-md-4 align-self-end">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/availability}" class="btn btn-link">Reset</a>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-lg-2 g-4">
        <div class="col">
            <div class="card h-100">
                <div class="card-header">Approved Leave</div>
                <div class="card-body p-0">
                    <table class="table mb-0 table-sm">
                        <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Start</th>
                            <th>End</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${availabilityPage.content}">
                            <td th:text="${entry.employeeName}"></td>
                            <td th:text="${entry.startDate}"></td>
                            <td th:text="${entry.endDate}"></td>
                        </tr>
                        <tr th:if="${availabilityPage.content.empty}">
                            <td colspan="3" class="text-center py-3">No approved leave found for the selected range.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <nav th:if="${availabilityPage.totalPages > 1}">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${availabilityPage.first}? 'disabled'">
                                <a class="page-link" th:href="@{/availability(page=${availabilityPage.number - 1}, startDate=${startDate}, endDate=${endDate})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, availabilityPage.totalPages - 1)}"
                                th:classappend="${pageNum} == ${availabilityPage.number}? 'active'">
                                <a class="page-link" th:href="@{/availability(page=${pageNum}, startDate=${startDate}, endDate=${endDate})}" th:text="${pageNum + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${availabilityPage.last}? 'disabled'">
                                <a class="page-link" th:href="@{/availability(page=${availabilityPage.number + 1}, startDate=${startDate}, endDate=${endDate})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100">
                <div class="card-header">Availability Summary</div>
                <div class="card-body p-0">
                    <table class="table mb-0 table-sm">
                        <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Available</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${availabilityPage.content}">
                            <td th:text="${entry.employeeName}"></td>
                            <td>
                                <span class="text-success">Yes</span>
                            </td>
                        </tr>
                        <tr th:if="${availabilityPage.content.empty}">
                            <td colspan="2" class="text-center py-3">No availability information available.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
