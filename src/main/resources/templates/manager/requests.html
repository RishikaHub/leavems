<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manager Requests - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid px-4 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Manager Requests</h3>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="get" th:action="@{/manager/requests}" class="row g-3 mb-4">
        <div class="col-md-3">
            <label class="form-label">Request Type</label>
            <select name="leaveType" class="form-select">
                <option value="">All</option>
                <option value="VACATION" th:selected="${leaveType == 'VACATION'}">Vacation</option>
                <option value="SICK" th:selected="${leaveType == 'SICK'}">Sick</option>
                <option value="PERSONAL" th:selected="${leaveType == 'PERSONAL'}">Personal</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Request Status</label>
            <select name="status" class="form-select">
                <option value="">All</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                <option value="REJECTED" th:selected="${status == 'REJECTED'}">Rejected</option>
                <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Search Employee</label>
            <input type="text" name="search" class="form-control" th:value="${search}" placeholder="Employee name">
        </div>

        <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-outline-primary">Apply</button>
            <a th:href="@{/manager/requests}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div th:if="${requests == null or requests.content == null or requests.content.isEmpty()}"
         class="text-muted mt-5">
        No team requests to display.
    </div>

    <div th:each="request : ${requests.content}" class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-start">
                <div class="col-md-2">
                    <div class="text-muted small">Employee</div>
                    <div class="fw-semibold" th:text="${request.requesterName}">Employee</div>
                </div>

                <div class="col-md-2">
                    <div class="text-muted small">Type</div>
                    <div th:text="${request.leaveType}">VACATION</div>
                </div>

                <div class="col-md-2">
                    <div class="text-muted small">Dates</div>
                    <div>
                        <span th:text="${request.startDate}">Start</span>
                        -
                        <span th:text="${request.endDate}">End</span>
                    </div>
                    <div class="small text-muted">
                        <span th:text="${request.dayCount}">1</span> day(s)
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="text-muted small">Status</div>
                    <span class="badge bg-secondary" th:text="${request.status}">PENDING</span>
                </div>

                <div class="col-md-2">
                    <div class="text-muted small">Reason</div>
                    <div th:text="${request.reason != null and !request.reason.isBlank() ? request.reason : 'No reason provided'}">
                        Reason
                    </div>
                </div>

                <div class="col-md-2">
                    <a th:href="@{/leave/requests/{id}(id=${request.id})}"
                       class="btn btn-sm btn-outline-primary mb-2 w-100">
                        View
                    </a>

                    <form th:if="${request.status.name() == 'PENDING'}"
                          th:action="@{/manager/requests/{id}/approve(id=${request.id})}"
                          method="post"
                          class="mb-2">
                        <input type="text"
                               name="managerNote"
                               class="form-control form-control-sm mb-1"
                               placeholder="Optional note">
                        <button type="submit" class="btn btn-sm btn-success w-100">Approve</button>
                    </form>

                    <form th:if="${request.status.name() == 'PENDING'}"
                          th:action="@{/manager/requests/{id}/reject(id=${request.id})}"
                          method="post">
                        <input type="text"
                               name="managerNote"
                               class="form-control form-control-sm mb-1"
                               placeholder="Optional note">
                        <button type="submit" class="btn btn-sm btn-danger w-100">Reject</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${requests != null and requests.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${requests.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/manager/requests(page=${requests.number - 1}, size=${requests.size}, status=${status}, leaveType=${leaveType}, search=${search})}">
                    Previous
                </a>
            </li>

            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Page ' + (${requests.number} + 1) + ' of ' + ${requests.totalPages}">
                    Page
                </span>
            </li>

            <li class="page-item" th:classappend="${requests.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/manager/requests(page=${requests.number + 1}, size=${requests.size}, status=${status}, leaveType=${leaveType}, search=${search})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
