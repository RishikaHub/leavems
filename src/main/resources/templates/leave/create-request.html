<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Leave Request - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
        }

        .page-shell {
            max-width: 980px;
            margin: 40px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .form-card-header {
            border-bottom: 1px solid #e9ecef;
            padding: 18px 22px;
        }

        .form-card-header h2 {
            color: #0b3558;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .form-card-body {
            padding: 22px;
        }

        .required {
            color: #dc3545;
        }

        .balance-box {
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 16px;
            background: #f8fafc;
        }

        .balance-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .balance-row:last-child {
            border-bottom: 0;
        }

        .reason-counter {
            text-align: right;
            color: #6c757d;
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-shell">
    <div class="mb-3">
        <a th:href="@{/leave/requests}" class="btn btn-outline-secondary">Back to My Requests</a>
    </div>

    <div class="form-card">
        <div class="form-card-header">
            <h2>Create Leave Request</h2>
        </div>

        <div class="form-card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form id="leaveRequestForm" method="post" th:action="@{/leave/requests}">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="startDate" class="form-label">Start Date <span class="required">*</span></label>
                            <input id="startDate" name="startDate" type="date" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="endDate" class="form-label">End Date <span class="required">*</span></label>
                            <input id="endDate" name="endDate" type="date" class="form-control" required>
                            <div class="form-text">End date must be the same as or after start date.</div>
                        </div>

                        <div class="mb-3">
                            <label for="leaveType" class="form-label">Leave Type <span class="required">*</span></label>
                            <select id="leaveType" name="leaveType" class="form-select" required>
                                <option value="">Select Leave Type</option>
                                <option value="VACATION">Vacation</option>
                                <option value="SICK">Sick</option>
                                <option value="PERSONAL">Personal</option>
                            </select>
                        </div>

                        <div class="balance-box">
                            <div class="fw-semibold mb-2">Available Balance</div>
                            <div th:each="balance : ${balances}" class="balance-row">
                                <span th:text="${balance.leaveType}">VACATION</span>
                                <strong th:text="${balance.remainingDays + ' days'}">20 days</strong>
                            </div>
                            <div th:if="${balances == null or balances.isEmpty()}" class="text-muted">
                                Balance information unavailable.
                            </div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="mb-3">
                            <label for="reason" class="form-label">Reason <span class="required">*</span></label>
                            <textarea id="reason" name="reason" class="form-control" rows="6" maxlength="255" required></textarea>
                            <div class="reason-counter"><span id="reasonCount">0</span> / 255</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notify Team/Peers</label>
                            <input type="text" class="form-control" placeholder="Notifications are not implemented" disabled>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/leave/requests}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Request</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const form = document.getElementById('leaveRequestForm');
    const reason = document.getElementById('reason');
    const count = document.getElementById('reasonCount');

    function syncEndDateMin() {
        if (!startDate.value) {
            endDate.removeAttribute('min');
            return;
        }

        endDate.min = startDate.value;

        if (endDate.value && endDate.value < startDate.value) {
            endDate.value = startDate.value;
        }
    }

    startDate.addEventListener('change', syncEndDateMin);
    startDate.addEventListener('input', syncEndDateMin);

    endDate.addEventListener('input', function () {
        if (startDate.value && endDate.value && endDate.value < startDate.value) {
            endDate.setCustomValidity('End date must be the same as or after start date.');
        } else {
            endDate.setCustomValidity('');
        }
    });

    form.addEventListener('submit', function (event) {
        syncEndDateMin();

        if (startDate.value && endDate.value && endDate.value < startDate.value) {
            event.preventDefault();
            endDate.setCustomValidity('End date must be the same as or after start date.');
            endDate.reportValidity();
        } else {
            endDate.setCustomValidity('');
        }
    });

    reason.addEventListener('input', function () {
        count.textContent = reason.value.length;
    });
</script>
</body>
</html>
