<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Leave Request - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: rgba(0, 0, 0, 0.35);
        }

        .modal-shell {
            max-width: 980px;
            margin: 48px auto;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .top-bar {
            height: 10px;
            background: #07477f;
        }

        .modal-body-custom {
            padding: 24px 26px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title-row h2 {
            font-size: 24px;
            font-weight: 700;
            color: #073b70;
            margin: 0;
        }

        .close-link {
            font-size: 42px;
            line-height: 1;
            text-decoration: none;
            color: #000;
        }

        .required {
            color: red;
        }

        .balance-box {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 18px 22px;
            min-height: 190px;
            background: #fff;
        }

        .balance-box p {
            font-size: 18px;
            margin-bottom: 16px;
        }

        textarea {
            resize: none;
        }

        .reason-counter {
            text-align: right;
            font-size: 14px;
            margin-top: 4px;
        }

        .note {
            font-size: 15px;
            color: #111;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }

        .btn-request {
            background: #07477f;
            color: white;
            min-width: 104px;
            font-weight: 600;
        }

        .btn-request:hover {
            background: #063b69;
            color: white;
        }

        .btn-cancel {
            min-width: 104px;
            border-color: #07477f;
            color: #07477f;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="modal-shell">
    <div class="top-bar"></div>

    <div class="modal-body-custom">
        <div class="title-row">
            <h2>Leave Request</h2>
            <a th:href="@{/leave/requests}" class="close-link">&times;</a>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form method="post" th:action="@{/leave/requests}">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="startDate" class="form-label">
                            Start Date <span class="required">*</span>
                        </label>
                        <input id="startDate"
                               name="startDate"
                               type="date"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="endDate" class="form-label">
                            End Date <span class="required">*</span>
                        </label>
                        <input id="endDate"
                               name="endDate"
                               type="date"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="leaveType" class="form-label">
                            Leave Type <span class="required">*</span>
                        </label>
                        <select id="leaveType" name="leaveType" class="form-select" required>
                            <option value="">Select Leave Type</option>
                            <option value="VACATION">Vacation Leave</option>
                            <option value="SICK">Sick Leave</option>
                            <option value="PERSONAL">Personal Leave</option>
                        </select>
                    </div>

                    <div class="balance-box">
                        <p><strong>Total Available Balance</strong></p>
                        <p th:each="balance : ${balances}"
                           th:text="${balance.leaveType + ' - ' + balance.remainingDays + ' days available'}">
                            Vacation - 20 days available
                        </p>
                        <p th:if="${balances == null or balances.isEmpty()}">
                            Balance information unavailable
                        </p>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="mb-3">
                        <label for="reason" class="form-label">
                            Reason <span class="required">*</span>
                        </label>
                        <textarea id="reason"
                                  name="reason"
                                  class="form-control"
                                  rows="4"
                                  maxlength="255"
                                  required></textarea>
                        <div class="reason-counter">
                            <span id="reasonCount">0</span> / 255
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notify Team/Peers</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Search Employee"
                               disabled>
                    </div>

                    <p class="note">
                        Note: Notifications are not implemented in this version.
                    </p>

                    <div class="actions">
                        <a th:href="@{/leave/requests}" class="btn btn-outline-primary btn-cancel">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-request">
                            Request
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    const reason = document.getElementById('reason');
    const count = document.getElementById('reasonCount');

    reason.addEventListener('input', function () {
        count.textContent = reason.value.length;
    });
</script>
</body>
</html>
