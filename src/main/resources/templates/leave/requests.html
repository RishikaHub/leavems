<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Requests - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .page-title {
            font-weight: 700;
            color: #0b3558;
        }

        .filter-bar {
            background: #f8fafc;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 16px;
        }

        .request-row {
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 12px;
            background: #fff;
        }

        .request-cell {
            padding: 14px 16px;
            border-right: 1px solid #e9ecef;
            min-height: 96px;
        }

        .request-cell:last-child {
            border-right: 0;
        }

        .label-small {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 4px;
        }

        .status-pill {
            display: inline-block;
            min-width: 120px;
            padding: 6px 10px;
            border-radius: 5px;
            font-weight: 600;
            text-align: center;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-APPROVED {
            background: #dff5d8;
            color: #1b5e20;
        }

        .status-REJECTED {
            background: #f8d7da;
            color: #842029;
        }

        .status-CANCELLED {
            background: #e2e3e5;
            color: #41464b;
        }

        .muted-link {
            color: #6c757d;
        }

        .primary-soft {
            color: #0b4a7a;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid px-4 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title mb-0">My Leave Requests</h3>
        <a th:href="@{/leave/requests/new}" class="btn btn-primary">
            Create Request
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="get" th:action="@{/leave/requests}" class="filter-bar mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <a th:href="@{/leave/requests}" class="muted-link">Show All Requests</a>
            </div>

            <div class="col-md-3">
                <label class="form-label">Request Type</label>
                <select name="leaveType" class="form-select">
                    <option value="">All</option>
                    <option value="VACATION" th:selected="${leaveType == 'VACATION'}">Vacation</option>
                    <option value="SICK" th:selected="${leaveType == 'SICK'}">Sick</option>
                    <option value="PERSONAL" th:selected="${leaveType == 'PERSONAL'}">Personal</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Request Status</label>
                <select name="status" class="form-select">
                    <option value="">All</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                    <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                    <option value="REJECTED" th:selected="${status == 'REJECTED'}">Rejected</option>
                    <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">Sort By</label>
                <select name="sort" class="form-select">
                    <option value="createdAt,desc" th:selected="${sort == 'createdAt,desc'}">Newest</option>
                    <option value="createdAt,asc" th:selected="${sort == 'createdAt,asc'}">Oldest</option>
                    <option value="startDate,asc" th:selected="${sort == 'startDate,asc'}">Start Date Asc</option>
                    <option value="startDate,desc" th:selected="${sort == 'startDate,desc'}">Start Date Desc</option>
                    <option value="endDate,asc" th:selected="${sort == 'endDate,asc'}">End Date Asc</option>
                    <option value="endDate,desc" th:selected="${sort == 'endDate,desc'}">End Date Desc</option>
                    <option value="status,asc" th:selected="${sort == 'status,asc'}">Status Asc</option>
                    <option value="status,desc" th:selected="${sort == 'status,desc'}">Status Desc</option>
                </select>
            </div>

            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-outline-primary">Apply Filters</button>
            </div>
        </div>
    </form>

    <div th:if="${requests == null or requests.content == null or requests.content.isEmpty()}"
         class="text-muted mt-5">
        No leave requests to display.
    </div>

    <div th:each="request : ${requests.content}" class="request-row">
        <div class="row g-0">
            <div class="col-md-2 request-cell">
                <div class="label-small">Request Type</div>
                <div class="primary-soft" th:text="${request.leaveType}">VACATION</div>
                <div class="small text-muted mt-2">
                    Requested on
                    <span th:text="${request.createdAt}">2026-05-15</span>
                </div>
            </div>

            <div class="col-md-2 request-cell">
                <div class="label-small">Requested For</div>
                <div>
                    <span th:text="${request.startDate}">2026-05-20</span>
                    <span> - </span>
                    <span th:text="${request.endDate}">2026-05-21</span>
                </div>
                <div class="small text-muted mt-2">
                    <span th:text="${request.dayCount}">1</span>
                    day(s)
                </div>
            </div>

            <div class="col-md-3 request-cell">
                <div class="label-small">Reason</div>
                <div th:text="${request.reason != null and !request.reason.isBlank() ? request.reason : 'No reason provided'}">
                    Family trip
                </div>
            </div>

            <div class="col-md-2 request-cell">
                <div class="label-small">Status</div>
                <span th:class="'status-pill status-' + ${request.status.name()}"
                      th:text="${request.status}">
                    PENDING
                </span>
            </div>

            <div class="col-md-2 request-cell">
                <div class="label-small">Decision</div>
                <div th:if="${request.decidedAt != null}">
                    <div>
                        On
                        <span th:text="${request.decidedAt}">2026-05-15</span>
                    </div>
                    <div th:if="${request.decidedByName != null}" class="small text-muted">
                        By <span th:text="${request.decidedByName}">Manager</span>
                    </div>
                </div>
                <div th:if="${request.decidedAt == null}" class="text-muted">
                    Not decided yet
                </div>
            </div>

            <div class="col-md-1 request-cell d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown">
                        Actions
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item"
                               th:href="@{/leave/requests/{id}(id=${request.id})}">
                                View
                            </a>
                        </li>

                        <li th:if="${request.status.name() == 'PENDING'}">
                            <form th:action="@{/leave/requests/{id}/withdraw(id=${request.id})}"
                                  method="post">
                                <button class="dropdown-item text-danger" type="submit">
                                    Withdraw
                                </button>
                            </form>
                        </li>

                        <li th:if="${request.status.name() == 'APPROVED'}">
                            <form th:action="@{/leave/requests/{id}/cancel(id=${request.id})}"
                                  method="post">
                                <button class="dropdown-item text-warning" type="submit">
                                    Cancel
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${requests != null and requests.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${requests.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/leave/requests(page=${requests.number - 1}, size=${requests.size}, status=${status}, leaveType=${leaveType}, sort=${sort})}">
                    Previous
                </a>
            </li>

            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Page ' + (${requests.number} + 1) + ' of ' + ${requests.totalPages}">
                    Page
                </span>
            </li>

            <li class="page-item" th:classappend="${requests.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/leave/requests(page=${requests.number + 1}, size=${requests.size}, status=${status}, leaveType=${leaveType}, sort=${sort})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
