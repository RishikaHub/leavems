<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Detail - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="fragments/layout :: navbar"></div>
<div class="container py-4">
    <h1 class="h4 mb-4">Request Detail</h1>
    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Request ID</dt>
                <dd class="col-sm-9" th:text="${request.id}"></dd>

                <dt class="col-sm-3">Employee</dt>
                <dd class="col-sm-9" th:text="${request.requesterName}"></dd>

                <dt class="col-sm-3">Type</dt>
                <dd class="col-sm-9" th:text="${request.leaveType}"></dd>

                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9" th:text="${request.status}"></dd>

                <dt class="col-sm-3">Start Date</dt>
                <dd class="col-sm-9" th:text="${request.startDate}"></dd>

                <dt class="col-sm-3">End Date</dt>
                <dd class="col-sm-9" th:text="${request.endDate}"></dd>

                <dt class="col-sm-3">Days</dt>
                <dd class="col-sm-9" th:text="${request.dayCount}"></dd>

                <dt class="col-sm-3">Reason</dt>
                <dd class="col-sm-9" th:text="${request.reason}"></dd>

                <dt class="col-sm-3">Manager Note</dt>
                <dd class="col-sm-9" th:text="${request.managerNote}">N/A</dd>

                <dt class="col-sm-3">Decided By</dt>
                <dd class="col-sm-9" th:text="${request.decidedByName}">N/A</dd>

                <dt class="col-sm-3">Decided At</dt>
                <dd class="col-sm-9" th:text="${request.decidedAt}">N/A</dd>
            </dl>
        </div>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-secondary" th:href="@{/leave/requests}">Back to requests</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
