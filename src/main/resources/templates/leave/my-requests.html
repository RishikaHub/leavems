<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Leave Requests - LeaveMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="fragments/layout :: navbar"></div>
<div class="container py-4">
    <h1 class="h4 mb-3">My Leave Requests</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form class="row g-3 mb-3" th:action="@{/leave/requests}" method="get">
        <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status">
                <option th:value="" th:text="'All'" selected>All</option>
                <option th:each="statusOption : ${statusOptions}" th:value="${statusOption}" th:text="${statusOption}"
                        th:selected="${statusOption} == ${selectedStatus}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Leave Type</label>
            <select class="form-select" name="leaveType">
                <option th:value="" selected>All</option>
                <option th:each="leaveTypeOption : ${leaveTypeOptions}" th:value="${leaveTypeOption}"
                        th:text="${leaveTypeOption}" th:selected="${leaveTypeOption} == ${selectedLeaveType}"></option>
            </select>
        </div>
        <div class="col-md-3 align-self-end">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/leave/requests}" class="btn btn-link">Reset</a>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th><a th:href="@{/leave/requests(sort='startDate')}" class="text-decoration-none">Start Date</a></th>
            <th><a th:href="@{/leave/requests(sort='endDate')}" class="text-decoration-none">End Date</a></th>
            <th>Status</th>
            <th>Type</th>
            <th>Days</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${requests.content}">
            <td th:text="${request.startDate}">2026-01-01</td>
            <td th:text="${request.endDate}">2026-01-05</td>
            <td th:text="${request.status}">PENDING</td>
            <td th:text="${request.leaveType}">VACATION</td>
            <td th:text="${request.dayCount}">5</td>
            <td>
                <a th:href="@{/leave/requests/{id}(id=${request.id})}" class="btn btn-sm btn-outline-primary">View</a>
                <a th:if="${request.status} == 'PENDING'" th:href="@{/leave/requests/{id}/edit(id=${request.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
            </td>
        </tr>
        <tr th:if="${requests.content.empty}">
            <td colspan="6" class="text-center">No requests found.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${requests.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${requests.first}? 'disabled'">
                <a class="page-link" th:href="@{/leave/requests(page=${requests.number - 1}, size=${requests.size})}">Previous</a>
            </li>
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, requests.totalPages - 1)}"
                th:classappend="${pageNum} == ${requests.number}? 'active'">
                <a class="page-link" th:href="@{/leave/requests(page=${pageNum}, size=${requests.size})}" th:text="${pageNum + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${requests.last}? 'disabled'">
                <a class="page-link" th:href="@{/leave/requests(page=${requests.number + 1}, size=${requests.size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
